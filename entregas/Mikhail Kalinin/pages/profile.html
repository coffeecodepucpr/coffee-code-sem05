<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Learnplat</title>
  <script src="../js/script.js" defer></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="navbar__logo">Learning Platform</a>
    <nav>
      <ul class="navbar__links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="profile.html" aria-current="page">Profile</a></li>
        <li><a href="login.html">Exit</a></li>
        <li><a href="profile.html" class="avatar" aria-label="Go to profile">JS</a></li>
      </ul>
    </nav>
  </header>
  
  <main>
    <div class="profile-top">
      <div class="avatar-profile avatar--lg" aria-hidden="true">JS</div>
      <div class="profile-info">
        <h2 id="profile-name">Loading problem...</h2>
        <p id="profile-email"></p>
        <div class="tags" id="profile-tags"></div>
        <div class="profile-stock">
          <button class="button button-primary" type="button">Edit profile</button>
          <button class="button botton-secondary" type="button">Exit</button>
        </div>
      </div>
    </div>

    <div class="page-header">
      <h1>My courses</h1>
      <p id="profile-count">You participate in 0 groups.</p>
    </div>

    <section class="dashboard-grid" aria-label="Courses you participate in" id="profile-grid">      
    </section>
  </main>
</body>
</html>
